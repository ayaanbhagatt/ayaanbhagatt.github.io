<div id="eye-stage" aria-hidden="true">
  <img
    id="eye-base"
    class="art-layer base-layer"
    src="{{ '/base.jpg' | relative_url }}"
    alt=""
  >

  <div
    class="tracked-eye"
    data-x="1065"
    data-y="960"
    data-size="120"
    data-travel="22"
  >
    <img src="{{ '/left-pupil.png' | relative_url }}" alt="">
  </div>

  <div
    class="tracked-eye"
    data-x="1725"
    data-y="920"
    data-size="120"
    data-travel="22"
  >
    <img src="{{ '/right-pupil.png' | relative_url }}" alt="">
  </div>

  <img
    class="art-layer foreground-layer"
    src="{{ '/foreground.png' | relative_url }}"
    alt=""
  >
</div>
<!-- FOREGROUND TOGGLE START — delete this block to remove the feature -->
<button
  id="foreground-toggle"
  type="button"
  aria-label="Toggle foreground artwork"
  aria-pressed="false"
>
  FG+
</button>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const button = document.querySelector("#foreground-toggle");
    const foreground = document.querySelector(".foreground-layer");

    if (!button || !foreground) return;

    button.addEventListener("click", () => {
      const visible = foreground.classList.toggle("foreground-visible");

      button.textContent = visible ? "FG−" : "FG+";
      button.setAttribute("aria-pressed", visible);
    });
  });
</script>
<!-- FOREGROUND TOGGLE END -->
<script
  src="{{ '/assets/js/eyes.js' | relative_url }}"
  defer>
</script>
