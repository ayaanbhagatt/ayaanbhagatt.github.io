<div id="eye-stage" aria-hidden="true">
  <img
    id="eye-base"
    class="art-layer base-layer"
    src="{{ '/base.jpg' | relative_url }}"
    alt=""
  >

  <div
    class="tracked-eye"
    data-x="1065"
    data-y="960"
    data-size="120"
    data-travel-x="22"
    data-travel-y="10"
  >
    <img src="{{ '/left-pupil.png' | relative_url }}" alt="">
  </div>

  <div
    class="tracked-eye"
    data-x="1725"
    data-y="935"
    data-size="120"
    data-travel-x="22"
    data-travel-y="10"
  >
    <img src="{{ '/right-pupil.png' | relative_url }}" alt="">
  </div>

  <img
    class="art-layer foreground-layer"
    src="{{ '/foreground.png' | relative_url }}"
    alt=""
  >
</div>

<!-- FOREGROUND TOGGLE START -->
<div id="foreground-toggle-wrapper"><button id="foreground-toggle" type="button" aria-label="Toggle foreground artwork" aria-pressed="false">FG+</button></div>

<script>
(function () {
  const button = document.getElementById("foreground-toggle");
  const foreground = document.querySelector(".foreground-layer");
  const storageKey = "foreground-visible";

  if (!button || !foreground) return;

  function readSavedState() {
    return localStorage.getItem(storageKey) === "true";
  }

  function displayForeground(visible) {
    foreground.classList.toggle("foreground-visible", visible);
    button.textContent = visible ? "FG-" : "FG+";
    button.setAttribute("aria-pressed", String(visible));
  }

  /* Apply saved setting immediately */
  displayForeground(readSavedState());

  button.addEventListener("click", function () {
    const visible = !readSavedState();

    localStorage.setItem(storageKey, String(visible));
    displayForeground(visible);
  });

  /* Reapply when Safari restores a previously visited page */
  window.addEventListener("pageshow", function () {
    displayForeground(readSavedState());
  });

  /* Keep multiple open tabs synchronized */
  window.addEventListener("storage", function (event) {
    if (event.key === storageKey) {
      displayForeground(readSavedState());
    }
  });
})();
</script>
<!-- FOREGROUND TOGGLE END -->

<script
  src="{{ '/assets/js/eyes.js' | relative_url }}?v={{ site.time | date: '%s' }}"
  defer>
</script>
